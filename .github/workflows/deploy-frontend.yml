name: Deploy frontend VPS
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: consaborflamenco-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout probado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verificar que commit tiene pruebas aprobadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          # Para la ejecución manual, exigir también el CI del commit seleccionado.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" --jq '.workflow_runs[] | select(.name=="Frontend CI" and .conclusion=="success") | .id' | grep -q .
      - name: Configurar SSH
        env:
          KEY: ${{ secrets.CSF_DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.CSF_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.CSF_DEPLOY_HOST }}
        run: |
          test -n "$KEY" && test -n "$KNOWN" && test -n "$HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Enviar código probado y desplegar
        env:
          HOST: ${{ secrets.CSF_DEPLOY_HOST }}
        run: |
          SHA="$(git rev-parse HEAD)"
          tar -czf "/tmp/csf-frontend-$SHA.tgz" --exclude=.git .
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "/tmp/csf-frontend-$SHA.tgz" "deploy@$HOST:/tmp/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "deploy@$HOST" "bash -s -- '$SHA'" < scripts/deploy-frontend.sh
